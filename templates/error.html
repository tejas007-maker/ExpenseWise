<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ code }} - ExpenseWise</title>

    <meta name="description"
          content="ExpenseWise - Smart Student Expense Tracker">

    <link rel="icon" type="image/svg+xml"
          href="{{ url_for('static', filename='favicon.svg') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container" style="max-width: 700px; margin: 80px auto; text-align: center;">

        <div class="card">

            <h1 style="font-size: 64px; margin-bottom: 10px;">
                {{ code }}
            </h1>

            <h2>{{ title }}</h2>

            <p style="margin: 20px 0;">
                {{ message }}
            </p>

            {% if current_user.is_authenticated %}

                <a href="{{ url_for('home') }}"
                   class="btn">
                    Back to Dashboard
                </a>

            {% else %}

                <a href="{{ url_for('landing') }}"
                   class="btn">
                    Back to Home
                </a>

                <a href="{{ url_for('login') }}"
                   class="btn"
                   style="margin-left: 10px;">
                    Login
                </a>

            {% endif %}

        </div>

        <p style="margin-top: 30px; opacity: 0.7;">
            ExpenseWise © 2026
        </p>

    </div>

</body>
</html>
